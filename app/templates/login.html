{% extends 'base.html' %}
{% block content %}
	<h2>Login to view the blogs</h2>
	<form method="POST">
		{{ form.hidden_tag() }}
		<label>{{ form.username.label }}</label>
		{{ form.username() }}
		<label>{{ form.password.label }}</label>
		{{ form.password() }}
		{{ form.submit() }}
	</form>
	<div style="margin-left: 5px;">
	<p>Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a></p>

{% endblock %}
