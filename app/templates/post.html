{% extends 'base.html' %}

{% block content %}
	<div class="content">
		<div class="post">
			<h2> {{post.title}} </h2>
			<p class="body">{{ post.content }}</p>
			<small>Posted by {{ post.author.username }} on {{ post.date_posted.strftime('%Y-%m-%d') }}</small>
			{% if session.get('user_id') == post.user_id %}
				<p>
					<a href="{{ url_for('main.edit', post_id=post.id) }}">Edit</a> |
					<a href="{{ url_for('main.delete', post_id=post.id) }}" onclick="return confirm('Are you sure?')">Delete</a>
				</p>
			{% endif %}
			<a href="{{ url_for('main.index') }}">Back to Home</a>
		</div>
	</div>
{% endblock %}
